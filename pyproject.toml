[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-customer-analysis"
version = "0.1.0"
description = "Reproducible analysis pipeline for the UCI Online Retail dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["jupyterlab>=4.0"]

[project.scripts]
ecommerce-analysis = "ecommerce_analysis.pipeline:main"
ecommerce-figures = "ecommerce_analysis.visualization:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
